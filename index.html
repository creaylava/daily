<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 时间线日志</title>
<style>
  :root{
    --bg:#f7f5f2; --card-bg:#ffffff; --text:#2e2a26; --muted:#8c8377;
    --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
    --timeline-line:#dcd5cb;
  }
  body.dark {
    --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --muted:#9e9e9e;
    --accent:#e07b39; --border:#444444; --input-bg:#2d2d2d;
    --timeline-line:#333333;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); transition:.3s;
  }
  
  /* 顶栏 */
  header{
    display:flex; align-items:center; padding:10px 20px; background:var(--card-bg);
    border-bottom:1px solid var(--border); gap:10px; z-index:10; flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header h1{font-size:16px; font-weight:700; margin-right:auto;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit;
    white-space:nowrap;
  }
  .btn:hover{background:var(--input-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{opacity:.9;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.icon{padding:7px 10px;}

  /* 时间线容器 */
  .timeline-container {
    flex:1; overflow-y:auto; padding:30px 20px;
    display:flex; flex-direction:column; align-items:center;
  }
  .timeline {
    width:100%; max-width:680px; position:relative;
    padding-left:30px;
  }
  
  /* 垂直中线 */
  .timeline::before {
    content:""; position:absolute; left:9px; top:0; bottom:0; width:2px;
    background:var(--timeline-line); border-radius:1px;
  }

  /* 时间线条目 */
  .timeline-item {
    position:relative; margin-bottom:30px;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  /* 时间线节点（圆点） */
  .timeline-dot {
    position:absolute; left:-25px; top:6px; width:14px; height:14px;
    background:var(--accent); border-radius:50%; border:3px solid var(--card-bg);
    box-shadow:0 1px 3px rgba(0,0,0,.2); z-index:2;
  }
  .timeline-dot.dot-inner { background:var(--card-bg); border-color:var(--accent); }

  /* 日志卡片 */
  .log-card {
    background:var(--card-bg); border-radius:12px; padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid var(--border);
    transition:.2s;
  }
  .log-card:hover { box-shadow:0 4px 15px rgba(0,0,0,.1); }

  .log-header {
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:8px;
  }
  .log-date {
    font-size:12px; color:var(--accent); font-weight:600; background:rgba(200,102,47,.1);
    padding:2px 8px; border-radius:6px;
  }
  .log-actions {
    display:flex; gap:6px; opacity:0; transition:.15s;
  }
  .log-card:hover .log-actions { opacity:1; }
  .log-actions button {
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px;
  }
  .log-actions button:hover { color:var(--text); }
  .log-actions button.delete-btn:hover { color:#d0453a; }

  .log-title { font-size:16px; font-weight:700; margin-bottom:6px; line-height:1.4; }
  .log-desc { font-size:14px; line-height:1.6; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .log-image {
    max-width:100%; max-height:280px; border-radius:8px; margin-top:10px;
    display:block; border:1px solid var(--border); object-fit:contain;
  }

  /* 空状态 */
  .empty-state {
    text-align:center; color:var(--muted); padding:80px 20px; font-size:14px;
  }

  /* 弹窗 */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:480px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:none; opacity:1;}}
  .m-title{font-size:17px; font-weight:600; margin-bottom:15px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:14px; font-family:inherit; color:var(--text);
    background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal textarea:focus { border-color:var(--accent); background:var(--card-bg); }
  .modal textarea { height:100px; resize:vertical; }
  .modal-actions{display:flex; gap:8px; margin-top:15px; align-items:center;}

  /* 图片上传 */
  .file-upload { 
    display: inline-block; padding:6px 12px; background:var(--input-bg); 
    border:1px dashed var(--border); border-radius:8px; cursor:pointer; 
    font-size:13px; color:var(--muted); text-align:center; width:100%;
  }
  .file-upload:active { background:var(--border); }
  #mImage { display: none; }
  .img-preview-container { position:relative; margin-top:8px; display:none; }
  .img-preview { max-width:100%; max-height:150px; border-radius:6px; border:1px solid var(--border); }
  .remove-img-btn { 
    position:absolute; top:5px; right:5px; background:rgba(0,0,0,.6); color:#fff; 
    border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:14px;
  }

  @media (max-width: 480px) {
    .timeline { padding-left:24px; }
    .timeline-dot { left:-19px; width:12px; height:12px; }
    .log-title { font-size:15px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌰 时间线日志</h1>
  <button class="btn primary" id="addLogBtn">＋ 添加日志</button>
  <button class="btn" id="exportBtn">导出Excel</button>
  <button class="btn icon" id="themeToggle" title="切换深色/浅色">🌙</button>
  <button class="btn danger" id="resetBtn">重置</button>
</header>

<div class="timeline-container" id="timelineContainer">
  <div class="timeline" id="timeline"></div>
</div>

<!-- 弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-title" id="modalTitle">添加日志</div>
    <div class="field">
      <label>日期</label>
      <input type="date" id="mDate">
    </div>
    <div class="field">
      <label>标题</label>
      <input id="mTitle" placeholder="如：设备调试异常、方案评审通过">
    </div>
    <div class="field">
      <label>详细记录</label>
      <textarea id="mDesc" placeholder="记录详细过程、数据、结论…"></textarea>
    </div>
    <div class="field">
      <label>插入照片（✨ 支持大图自动压缩）</label>
      <label for="mImage" class="file-upload" id="uploadLabel">📷 点击选择本地图片</label>
      <input type="file" id="mImage" accept="image/*">
      <div class="img-preview-container" id="imgPreviewContainer">
        <img id="imgPreview" class="img-preview" src="">
        <button type="button" class="remove-img-btn" id="removeImgBtn">✕</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div style="flex:1"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'timeline-log-v1';
const THEME_KEY = 'timeline-log-theme';
const uid = () => Math.random().toString(36).slice(2, 10);

function defaultData() {
  const today = new Date();
  return {
    logs: [
      {
        id: uid(),
        date: today.toISOString().slice(0, 10),
        title: '项目启动会议',
        desc: '确认了非标设备的设计指标、交期节点与预算范围。\n下一步：输出概念设计方案。',
        image: ''
      }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.logs) return d; }
  } catch (e) {}
  return defaultData();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { alert('存储空间不足，请清理图片或数据！'); } }

let state = loadState();
let editingId = null;

/* =========================================================
   主题切换
   ========================================================= */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
  else { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) { applyTheme(savedTheme); } else {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}
themeBtn.onclick = () => {
  const isDark = document.body.classList.contains('dark');
  const t = isDark ? 'light' : 'dark';
  applyTheme(t); localStorage.setItem(THEME_KEY, t);
};

/* =========================================================
   渲染时间线
   ========================================================= */
function render() {
  const timeline = document.getElementById('timeline');
  if (!state.logs.length) {
    timeline.innerHTML = '<div class="empty-state">还没有日志，点击右上角「添加日志」记录第一条吧 ✨</div>';
    saveState();
    return;
  }

  const sortedLogs = [...state.logs].sort((a, b) => b.date.localeCompare(a.date));

  timeline.innerHTML = sortedLogs.map((log, index) => {
    const dotClass = index % 2 === 0 ? 'timeline-dot' : 'timeline-dot dot-inner';
    const imgHtml = log.image ? `<img src="${log.image}" class="log-image" alt="附图">` : '';
    return `
      <div class="timeline-item" data-id="${log.id}">
        <div class="${dotClass}"></div>
        <div class="log-card">
          <div class="log-header">
            <span class="log-date">${log.date}</span>
            <div class="log-actions">
              <button class="edit-btn" data-id="${log.id}" title="编辑">✏️</button>
              <button class="delete-btn" data-id="${log.id}" title="删除">✕</button>
            </div>
          </div>
          <div class="log-title">${esc(log.title)}</div>
          <div class="log-desc">${esc(log.desc)}</div>
          ${imgHtml}
        </div>
      </div>
    `;
  }).join('');
  
  saveState();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   新增 / 编辑 / 删除
   ========================================================= */
const overlay = document.getElementById('overlay');
const mDate = document.getElementById('mDate');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mImage = document.getElementById('mImage');
const imgPreviewContainer = document.getElementById('imgPreviewContainer');
const imgPreview = document.getElementById('imgPreview');

let currentImageBase64 = '';

function openModal(title, log = null) {
  document.getElementById('modalTitle').textContent = title;
  if (log) {
    editingId = log.id;
    mDate.value = log.date;
    mTitle.value = log.title;
    mDesc.value = log.desc;
    currentImageBase64 = log.image || '';
  } else {
    editingId = null;
    const today = new Date();
    mDate.value = today.toISOString().slice(0, 10);
    mTitle.value = ''; mDesc.value = ''; currentImageBase64 = '';
  }
  
  if (currentImageBase64) {
    imgPreview.src = currentImageBase64;
    imgPreviewContainer.style.display = 'block';
  } else {
    imgPreview.src = '';
    imgPreviewContainer.style.display = 'none';
  }
  
  overlay.classList.add('show');
  setTimeout(() => mTitle.focus(), 30);
}

function closeModal() { overlay.classList.remove('show'); editingId = null; mImage.value = ''; }

document.getElementById('addLogBtn').onclick = () => openModal('添加日志');
document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

// =========================================================
// 🌟 核心：新增智能压缩逻辑
// =========================================================
mImage.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // 界面提示正在压缩
  document.getElementById('uploadLabel').textContent = '⏳ 正在压缩图片...';

  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      // 1. 计算缩放比例，限制最大宽度 1200px（兼顾清晰度和体积）
      const maxW = 1200;
      const maxH = 1200;
      let width = img.width;
      let height = img.height;

      if (width > maxW || height > maxH) {
        const ratio = Math.min(maxW / width, maxH / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }

      // 2. 绘制到 Canvas 并生成压缩后的 Base64
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      // 3. 质量参数设为 0.7 (70%)，大幅减小体积
      currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);

      // 4. 显示预览
      imgPreview.src = currentImageBase64;
      imgPreviewContainer.style.display = 'block';
      
      // 恢复按钮文字
      document.getElementById('uploadLabel').textContent = '📷 点击选择本地图片';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  mImage.value = ''; // 允许重复选择同一张图片
};

document.getElementById('removeImgBtn').onclick = () => {
  currentImageBase64 = '';
  imgPreview.src = '';
  imgPreviewContainer.style.display = 'none';
  mImage.value = '';
};

document.getElementById('mSave').onclick = () => {
  const title = mTitle.value.trim();
  if (!title) { alert('请输入标题'); return; }
  if (!mDate.value) { alert('请选择日期'); return; }

  const logData = {
    date: mDate.value, title: title, desc: mDesc.value.trim(),
    image: currentImageBase64
  };

  if (editingId) {
    const log = state.logs.find(l => l.id === editingId);
    if (log) Object.assign(log, logData);
  } else {
    state.logs.push({ id: uid(), ...logData });
  }
  closeModal(); render();
};

document.getElementById('mDelete').onclick = () => {
  if (!editingId) { closeModal(); return; }
  if (!confirm('确定删除这条日志吗？')) return;
  state.logs = state.logs.filter(l => l.id !== editingId);
  closeModal(); render();
};

// 事件委托
document.getElementById('timeline').addEventListener('click', (e) => {
  const editBtn = e.target.closest('.edit-btn');
  const deleteBtn = e.target.closest('.delete-btn');
  
  if (editBtn) {
    const log = state.logs.find(l => l.id === editBtn.dataset.id);
    if (log) openModal('编辑日志', log);
  }
  if (deleteBtn) {
    if (confirm('确定删除这条日志吗？')) {
      state.logs = state.logs.filter(l => l.id !== deleteBtn.dataset.id);
      render();
    }
  }
});

/* =========================================================
   导出 Excel (CSV)
   ========================================================= */
document.getElementById('exportBtn').onclick = () => {
  let csvContent = "\uFEFF日期,标题,详细记录,有无图片\n";
  const sortedLogs = [...state.logs].sort((a, b) => a.date.localeCompare(b.date));
  
  sortedLogs.forEach(log => {
    const hasImage = log.image ? '有' : '无';
    const cleanDesc = (log.desc || '').replace(/\n/g, ' ').replace(/"/g, '""');
    csvContent += [`"${log.date}"`, `"${log.title}"`, `"${cleanDesc}"`, `"${hasImage}"`].join(",") + "\n";
  });
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '时间线日志导出.csv';
  link.click();
  URL.revokeObjectURL(link.href);
};

document.getElementById('resetBtn').onclick = () => {
  if (!confirm('确定清空所有数据并恢复示例吗？')) return;
  state = defaultData(); render();
};

render();
</script>
</body>
</html>
