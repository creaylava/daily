<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌰 时间线日志</title>
<style>
  :root{
    --bg:#f4f5f7; --card-bg:#ffffff; --text:#1c1c1e; --muted:#8e8e93;
    --accent:#3b82f6; --border:#e5e5ea; --input-bg:#ffffff;
    --line:#e5e5ea; --icon-bg:#eef2f7; --icon-color:#3b82f6;
    --tag-bg:#eef2f7; --tag-text:#3b82f6; --tag-active-bg:#3b82f6; --tag-active-text:#fff;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --bg:#000000; --card-bg:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93;
      --accent:#0a84ff; --border:#2c2c2e; --input-bg:#1c1c1e;
      --line:#2c2c2e; --icon-bg:#1c2c40; --icon-color:#0a84ff;
      --tag-bg:#2c2c2e; --tag-text:#0a84ff; --tag-active-bg:#0a84ff; --tag-active-text:#fff;
    }
  }
  body.light{
    --bg:#f4f5f7; --card-bg:#ffffff; --text:#1c1c1e; --muted:#8e8e93;
    --accent:#3b82f6; --border:#e5e5ea; --input-bg:#ffffff;
    --line:#e5e5ea; --icon-bg:#eef2f7; --icon-color:#3b82f6;
    --tag-bg:#eef2f7; --tag-text:#3b82f6; --tag-active-bg:#3b82f6; --tag-active-text:#fff;
  }
  body.dark{
    --bg:#000000; --card-bg:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93;
    --accent:#0a84ff; --border:#2c2c2e; --input-bg:#1c1c1e;
    --line:#2c2c2e; --icon-bg:#1c2c40; --icon-color:#0a84ff;
    --tag-bg:#2c2c2e; --tag-text:#0a84ff; --tag-active-bg:#0a84ff; --tag-active-text:#fff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); transition:background .3s, color .3s;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header{
    padding:10px 14px; background:var(--bg); z-index:10; flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .header-top {
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-title{ font-size:16px; font-weight:700; color:var(--text); }
  .header-sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .header-left { display:flex; flex-direction:column; }
  .header-right { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .icon-btn{
    height:32px; padding:0 10px; border-radius:16px;
    border:1px solid var(--border); background:var(--card-bg);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; transition:.15s; white-space:nowrap;
    font-family:inherit;
  }
  .icon-btn:active{transform:scale(.95);}
  .icon-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .icon-btn.danger{ color:#ef4444; border-color:#ef4444; }

  .tag-bar {
    display:flex; gap:6px; padding:8px 14px 4px;
    overflow-x:auto; flex-shrink:0;
    scrollbar-width:none; background:var(--bg); min-height:36px;
  }
  .tag-bar::-webkit-scrollbar { display:none; }
  .tag-chip {
    padding:4px 12px; border-radius:14px;
    background:var(--tag-bg); color:var(--tag-text);
    font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    border:none; transition:.15s; font-family:inherit;
  }
  .tag-chip:active{transform:scale(.95);}
  .tag-chip.active { background:var(--tag-active-bg); color:var(--tag-active-text); }

  .log-list { flex:1; overflow-y:auto; padding:4px 0; -webkit-overflow-scrolling: touch; }
  .log-item {
    display:flex; align-items:flex-start;
    padding:12px 14px; gap:12px;
    border-bottom:1px solid var(--border);
    cursor:pointer; transition:background .15s;
  }
  .log-item:hover, .log-item:active { background:var(--card-bg); }

  .log-date {
    width:60px; flex-shrink:0; text-align:right;
    display:flex; flex-direction:column; align-items:flex-end; gap:2px;
    padding-top:2px;
  }
  .log-time { font-size:13px; font-weight:600; color:var(--text); font-variant-numeric: tabular-nums; }
  .log-day { font-size:11px; color:var(--muted); font-variant-numeric: tabular-nums; }

  .log-icon {
    width:26px; height:26px; border-radius:50%;
    background:var(--icon-bg); color:var(--icon-color);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0; margin-top:1px;
  }

  .log-body { flex:1; min-width:0; }
  .log-title {
    font-size:15px; font-weight:600; color:var(--text);
    line-height:1.4;
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .log-desc {
    font-size:12px; color:var(--muted); margin-top:4px;
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
  }
  .log-tags {
    display:flex; gap:4px; flex-wrap:wrap; margin-top:6px;
  }
  .log-tag {
    font-size:10px; padding:1px 7px; border-radius:8px;
    background:var(--tag-bg); color:var(--tag-text); font-weight:600;
  }
  .log-thumb { width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; margin-left:8px; }

  .group-header {
    padding:12px 14px 6px 14px;
    font-size:11px; font-weight:700; color:var(--muted);
    letter-spacing:1px; background:var(--bg);
    position:sticky; top:0; z-index:5;
  }

  .empty-state { text-align:center; color:var(--muted); padding:80px 20px; font-size:13px; line-height:2; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:16px; width:100%; max-width:460px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.4); max-height:90vh; overflow-y:auto;
    animation:pop .2s ease-out; border:1px solid var(--border);
  }
  @keyframes pop{from{transform:translateY(10px) scale(.96); opacity:0;} to{transform:none; opacity:1;}}
  .m-title{font-size:17px; font-weight:700; margin-bottom:15px; color:var(--text);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .modal input, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px;
    font-size:14px; font-family:inherit; color:var(--text);
    background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal textarea:focus { border-color:var(--accent); }
  .modal textarea { height:80px; resize:none; }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:14px; align-items:center;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:14px; cursor:pointer;
    transition:.15s; font-family:inherit; flex:1; text-align:center;
  }
  .btn:active{opacity:.7;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.danger{color:#ef4444; border-color:#ef4444; flex:0 0 auto;}

  /* 标签输入 */
  .tag-input-wrap {
    display:flex; flex-wrap:wrap; gap:6px; padding:8px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--input-bg); min-height:42px; align-items:center;
  }
  .tag-input-wrap input {
    flex:1; min-width:80px; border:none; background:transparent;
    padding:4px; font-size:13px; outline:none; color:var(--text);
  }
  .tag-pill {
    display:inline-flex; align-items:center; gap:4px;
    background:var(--tag-bg); color:var(--tag-text);
    padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600;
  }
  .tag-pill .remove-tag {
    background:none; border:none; color:inherit; cursor:pointer;
    font-size:14px; padding:0; line-height:1; opacity:.7;
  }
  .tag-suggestions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tag-suggestion {
    font-size:11px; padding:3px 10px; border-radius:10px;
    background:var(--tag-bg); color:var(--tag-text);
    border:none; cursor:pointer; font-weight:600; font-family:inherit;
  }

  /* 文件上传 */
  .file-upload {
    display:inline-block; padding:8px 12px; background:var(--input-bg);
    border:1px dashed var(--border); border-radius:10px; cursor:pointer;
    font-size:12px; color:var(--muted); text-align:center; width:100%;
  }
  .img-preview-container { position:relative; margin-top:8px; display:none; }
  .img-preview { max-width:100%; max-height:140px; border-radius:8px; }
  .remove-img-btn {
    position:absolute; top:5px; right:5px; background:rgba(0,0,0,.6); color:#fff;
    border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:14px;
  }
  #mImage, #importFileInput { display:none; }

  /* 同步弹窗专用 */
  .sync-status {
    padding: 10px 12px; border-radius: 10px; font-size: 12px;
    background: var(--input-bg); border: 1px solid var(--border);
    margin-bottom: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .sync-status.ok { border-color: #22c55e; background: rgba(34,197,94,.08); color: #22c55e; }
  .sync-status.err { border-color: #ef4444; background: rgba(239,68,68,.08); color: #ef4444; }
  .sync-status.info { border-color: var(--accent); background: rgba(59,130,246,.06); color: var(--accent); }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0;
  }
  .checkbox-row input[type="checkbox"] { width: auto; }
  .checkbox-row label { margin: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .help-text {
    font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6;
  }
  .help-text code {
    background: var(--input-bg); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, monospace; font-size: 10px;
  }
  .help-text a { color: var(--accent); }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="header-left">
      <div class="header-title">🌰 时间线日志</div>
      <div class="header-sub" id="todayDisplay">加载中...</div>
    </div>
    <div class="header-right">
      <button class="icon-btn primary" id="fabAdd">＋ 日志</button>
      <button class="icon-btn" id="syncBtn" title="GitHub 同步">☁️</button>
      <button class="icon-btn" id="themeToggle" title="切换主题">🌓</button>
      <button class="icon-btn" id="settingsBtn" title="更多">⚙️</button>
    </div>
  </div>
</div>

<div class="tag-bar" id="tagBar"></div>
<div class="log-list" id="logList"></div>

<!-- 日志编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-title" id="modalTitle">添加日志</div>
    <div class="grid2">
      <div class="field"><label>日期</label><input type="date" id="mDate"></div>
      <div class="field"><label>时间</label><input type="time" id="mTime"></div>
    </div>
    <div class="field"><label>标题</label><input id="mTitle" placeholder="今天发生了什么"></div>
    <div class="field"><label>详细记录（选填）</label><textarea id="mDesc" placeholder="记录详细过程…"></textarea></div>
    <div class="field">
      <label>标签（回车确认，可多个）</label>
      <div class="tag-input-wrap" id="tagInputWrap">
        <input id="tagInput" placeholder="输入标签…">
      </div>
      <div class="tag-suggestions" id="tagSuggestions"></div>
    </div>
    <div class="field">
      <label>插入照片（✨ 自动压缩）</label>
      <label for="mImage" class="file-upload" id="uploadLabel">📷 点击选择本地图片</label>
      <input type="file" id="mImage" accept="image/*">
      <div class="img-preview-container" id="imgPreviewContainer">
        <img id="imgPreview" class="img-preview" src="">
        <button type="button" class="remove-img-btn" id="removeImgBtn">✕</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal" style="max-width:400px;">
    <div class="m-title">⚙️ 设置</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn" id="exportBtn">📊 导出 Excel（CSV）</button>
      <button class="btn" id="backupBtn">📥 备份 JSON</button>
      <button class="btn" id="importBtn">📤 导入 JSON</button>
      <input type="file" id="importFileInput" accept=".json">
      <button class="btn danger" id="resetBtn">⚠️ 重置全部数据</button>
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn" id="settingsCloseBtn" style="flex:1;">关闭</button>
    </div>
  </div>
</div>

<!-- GitHub 同步弹窗 -->
<div class="overlay" id="syncOverlay">
  <div class="modal" style="max-width:480px;">
    <div class="m-title">☁️ GitHub 同步</div>

    <div class="sync-status" id="syncStatusBox">检查配置...</div>

    <div class="field">
      <label>GitHub Token（只存在本机）</label>
      <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxx 或 github_pat_xxx">
      <div class="help-text">
        去 <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>
        生成 <b>Classic token</b>，只需勾选 <code>gist</code> 权限。
      </div>
    </div>

    <div class="field">
      <label>Gist ID</label>
      <input type="text" id="ghGistInput" placeholder="例如 a1b2c3d4e5f6...">
      <div class="help-text">
        <b>首次使用：</b>去 <a href="https://gist.github.com" target="_blank">gist.github.com</a> 创建 <b>Secret</b> Gist，
        文件名填 <code>journal.json</code>，内容填 <code>{}</code>。地址栏最后一段就是 Gist ID。
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="autoSyncCheck">
      <label for="autoSyncCheck">自动同步（每次修改后 3 秒自动上传）</label>
    </div>

    <div class="modal-actions" style="margin-top:10px;">
      <button class="btn" id="testConnBtn">🔌 测试连接</button>
      <button class="btn" id="syncPullBtn">⬇️ 拉取</button>
      <button class="btn primary" id="syncPushBtn">⬆️ 推送</button>
    </div>
    <div class="modal-actions" style="margin-top:8px;">
      <button class="btn" id="syncSaveConfigBtn" style="flex:1;">💾 保存配置</button>
      <button class="btn" id="syncCloseBtn" style="flex:1;">关闭</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'timeline-log-v5';
const THEME_KEY = 'timeline-log-theme';
const GH_TOKEN_KEY = 'timeline-log-gh-token';
const GH_GIST_KEY = 'timeline-log-gh-gist';
const AUTO_SYNC_KEY = 'timeline-log-auto-sync';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaultData() {
  const today = new Date();
  const t1 = new Date(today); t1.setDate(today.getDate() - 1);
  const t2 = new Date(today); t2.setDate(today.getDate() - 3);
  return {
    logs: [
      { id: uid(), date: today.toISOString().slice(0,10), time: '21:59', title: '项目启动会议', desc: '确认了非标设备的设计指标、交期节点与预算范围。', image: '', tags: [] },
      { id: uid(), date: t1.toISOString().slice(0,10), time: '18:50', title: '整理以前的日志', desc: '决定重新开始记录每日进展。', image: '', tags: [] },
      { id: uid(), date: t2.toISOString().slice(0,10), time: '16:32', title: '带娃去万达广场', desc: '结果发生了小意外。', image: '', tags: [] }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('timeline-log-v4');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.logs)) {
        d.logs.forEach(l => { if (!l.tags) l.tags = []; });
        return d;
      }
    }
  } catch (e) {}
  return defaultData();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  if (autoSyncEnabled) schedulePush();
}

let state = loadState();
let editingId = null;
let currentFilterTag = null;
let editingTags = [];

/* =========================================================
   GitHub 同步
   ========================================================= */
let ghToken = localStorage.getItem(GH_TOKEN_KEY) || '';
let ghGistId = localStorage.getItem(GH_GIST_KEY) || '';
let autoSyncEnabled = localStorage.getItem(AUTO_SYNC_KEY) === '1';
let _isPushing = false;
let _pushTimer = null;
let _lastSyncTime = null;

function setSyncStatus(msg, type) {
  const box = document.getElementById('syncStatusBox');
  if (!box) return;
  box.textContent = msg;
  box.className = 'sync-status ' + (type || '');
}

function schedulePush() {
  if (_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushToCloud({ silent: true }); }, 3000);
}

async function ghFetchGist() {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    headers: {
      'Authorization': `token ${ghToken}`,
      'Accept': 'application/vnd.github+json'
    }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.slice(0, 150)}`);
  }
  return res.json();
}

async function ghUpdateGist(content) {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    method: 'PATCH',
    headers: {
      'Authorization': `token ${ghToken}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      files: {
        'journal.json': { content: content }
      }
    })
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.slice(0, 150)}`);
  }
  return res.json();
}

async function testConnection() {
  if (!ghToken || !ghGistId) {
    setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return false;
  }
  try {
    setSyncStatus('🔌 正在测试连接...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['journal.json'];
    if (!file) {
      setSyncStatus('⚠️ 连接成功，但 Gist 里没有 journal.json 文件。请检查文件名。', 'info');
      return false;
    }
    setSyncStatus(`✅ 连接成功！\n文件大小：${file.size} 字节\n最后更新：${new Date(gist.updated_at).toLocaleString()}`, 'ok');
    return true;
  } catch (e) {
    setSyncStatus('❌ 连接失败：' + e.message, 'err');
    return false;
  }
}

async function pushToCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    _isPushing = true;
    setSyncStatus('⏫ 上传中...', 'info');
    const content = JSON.stringify(state, null, 2);
    await ghUpdateGist(content);
    _lastSyncTime = new Date();
    setSyncStatus('✅ 已上传到 GitHub（' + _lastSyncTime.toLocaleTimeString() + '）', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 上传失败：' + e.message, 'err');
    if (!opts.silent) alert('上传失败：' + e.message);
  } finally {
    setTimeout(() => { _isPushing = false; }, 500);
  }
}

async function pullFromCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    setSyncStatus('⏬ 拉取中...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['journal.json'];
    if (!file) {
      setSyncStatus('⚠️ Gist 里没有 journal.json 文件', 'err');
      return;
    }
    const raw = file.content || '';
    if (!raw.trim() || raw.trim() === '{}') {
      setSyncStatus('ℹ️ 云端还是空的（journal.json 内容是 {}），请先点「推送」上传。', 'info');
      return;
    }
    const cloudData = JSON.parse(raw);
    if (!cloudData.logs || !Array.isArray(cloudData.logs)) {
      throw new Error('云端数据格式不对（不是日志数据）');
    }
    _isPushing = true;
    state = cloudData;
    state.logs.forEach(l => { if (!l.tags) l.tags = []; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
    setTimeout(() => { _isPushing = false; }, 500);
    _lastSyncTime = new Date();
    setSyncStatus('✅ 已从 GitHub 同步（' + _lastSyncTime.toLocaleTimeString() + '）', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 拉取失败：' + e.message, 'err');
    if (!opts.silent) alert('拉取失败：' + e.message);
  }
}

/* =========================================================
   主题
   ========================================================= */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'light') { document.body.classList.add('light'); document.body.classList.remove('dark'); }
  else if (theme === 'dark') { document.body.classList.add('dark'); document.body.classList.remove('light'); }
  else { document.body.classList.remove('light'); document.body.classList.remove('dark'); }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) applyTheme(savedTheme);

themeBtn.onclick = () => {
  const current = localStorage.getItem(THEME_KEY) || 'auto';
  let next;
  if (current === 'auto') next = 'light';
  else if (current === 'light') next = 'dark';
  else next = 'auto';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
  themeBtn.textContent = next === 'auto' ? '🌓' : next === 'light' ? '☀️' : '🌙';
};
themeBtn.textContent = (savedTheme === 'light') ? '☀️' : (savedTheme === 'dark') ? '🌙' : '🌓';

/* =========================================================
   渲染
   ========================================================= */
const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((today - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return `${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
}

function renderTagBar() {
  const tagBar = document.getElementById('tagBar');
  const tagCount = {};
  state.logs.forEach(log => {
    (log.tags || []).forEach(t => {
      tagCount[t] = (tagCount[t] || 0) + 1;
    });
  });
  const tags = Object.keys(tagCount).sort();

  if (tags.length === 0) { tagBar.innerHTML = ''; return; }

  let html = `<button class="tag-chip ${currentFilterTag === null ? 'active' : ''}" data-tag="">全部</button>`;
  tags.forEach(tag => {
    html += `<button class="tag-chip ${currentFilterTag === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)} · ${tagCount[tag]}</button>`;
  });
  tagBar.innerHTML = html;
}

document.getElementById('tagBar').addEventListener('click', (e) => {
  const chip = e.target.closest('.tag-chip');
  if (!chip) return;
  const tag = chip.dataset.tag;
  currentFilterTag = tag || null;
  render();
});

function render() {
  renderTagBar();

  const list = document.getElementById('logList');
  let filtered = state.logs;
  if (currentFilterTag) {
    filtered = filtered.filter(log => (log.tags || []).includes(currentFilterTag));
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">' +
      (currentFilterTag ? `没有「${esc(currentFilterTag)}」标签的日志` : '还没有日志<br>点击右上角 ＋ 记录第一条吧 ✨') +
      '</div>';
    saveState();
    return;
  }

  const sortedLogs = [...filtered].sort((a, b) => {
    const dateCompare = b.date.localeCompare(a.date);
    if (dateCompare !== 0) return dateCompare;
    return (b.time || '').localeCompare(a.time || '');
  });

  let lastDate = '';
  let html = '';
  sortedLogs.forEach(log => {
    if (log.date !== lastDate) {
      html += `<div class="group-header">${formatDate(log.date)}</div>`;
      lastDate = log.date;
    }

    const thumb = log.image ? `<img class="log-thumb" src="${log.image}" alt="">` : '';
    const desc = log.desc ? `<div class="log-desc">${esc(log.desc)}</div>` : '';
    const tagsHtml = (log.tags && log.tags.length)
      ? `<div class="log-tags">${log.tags.map(t => `<span class="log-tag">${esc(t)}</span>`).join('')}</div>`
      : '';
    const d = new Date(log.date);
    html += `
      <div class="log-item" data-id="${log.id}">
        <div class="log-date">
          <div class="log-time">${log.time || ''}</div>
          <div class="log-day">${d.getMonth()+1}/${d.getDate()}</div>
        </div>
        <div class="log-icon">⚓</div>
        <div class="log-body">
          <div class="log-title">${esc(log.title)}</div>
          ${desc}
          ${tagsHtml}
        </div>
        ${thumb}
      </div>
    `;
  });

  list.innerHTML = html;
  saveState();
}

const now = new Date();
document.getElementById('todayDisplay').textContent = `${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

/* =========================================================
   弹窗
   ========================================================= */
const overlay = document.getElementById('overlay');
const mDate = document.getElementById('mDate');
const mTime = document.getElementById('mTime');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mImage = document.getElementById('mImage');
const imgPreviewContainer = document.getElementById('imgPreviewContainer');
const imgPreview = document.getElementById('imgPreview');
const tagInput = document.getElementById('tagInput');
const tagInputWrap = document.getElementById('tagInputWrap');
const tagSuggestions = document.getElementById('tagSuggestions');
let currentImageBase64 = '';

function renderTagPills() {
  tagInputWrap.querySelectorAll('.tag-pill').forEach(p => p.remove());
  editingTags.forEach((tag, i) => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${esc(tag)}<button class="remove-tag" data-i="${i}">×</button>`;
    tagInputWrap.insertBefore(pill, tagInput);
  });
}

tagInputWrap.addEventListener('click', (e) => {
  if (e.target.classList.contains('remove-tag')) {
    const i = parseInt(e.target.dataset.i);
    editingTags.splice(i, 1);
    renderTagPills();
    renderSuggestions();
  } else {
    tagInput.focus();
  }
});

tagInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ',' || e.key === '，') {
    e.preventDefault();
    const v = tagInput.value.trim();
    if (v && !editingTags.includes(v)) {
      editingTags.push(v);
      renderTagPills();
      renderSuggestions();
    }
    tagInput.value = '';
  } else if (e.key === 'Backspace' && !tagInput.value && editingTags.length > 0) {
    editingTags.pop();
    renderTagPills();
    renderSuggestions();
  }
});

function renderSuggestions() {
  const allTags = new Set();
  state.logs.forEach(log => (log.tags || []).forEach(t => allTags.add(t)));
  const arr = Array.from(allTags).filter(t => !editingTags.includes(t));
  if (arr.length === 0) { tagSuggestions.innerHTML = ''; return; }
  tagSuggestions.innerHTML = arr.map(t => `<button class="tag-suggestion" data-tag="${esc(t)}">+ ${esc(t)}</button>`).join('');
}
tagSuggestions.addEventListener('click', (e) => {
  const btn = e.target.closest('.tag-suggestion');
  if (!btn) return;
  const tag = btn.dataset.tag;
  if (!editingTags.includes(tag)) {
    editingTags.push(tag);
    renderTagPills();
    renderSuggestions();
  }
});

function openModal(title, log = null) {
  document.getElementById('modalTitle').textContent = title;
  if (log) {
    editingId = log.id;
    mDate.value = log.date;
    mTime.value = log.time || '00:00';
    mTitle.value = log.title;
    mDesc.value = log.desc || '';
    currentImageBase64 = log.image || '';
    editingTags = [...(log.tags || [])];
  } else {
    editingId = null;
    const n = new Date();
    mDate.value = n.toISOString().slice(0,10);
    mTime.value = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    mTitle.value = ''; mDesc.value = ''; currentImageBase64 = '';
    editingTags = [];
    if (currentFilterTag) editingTags.push(currentFilterTag);
  }
  tagInput.value = '';
  renderTagPills();
  renderSuggestions();

  if (currentImageBase64) {
    imgPreview.src = currentImageBase64; imgPreviewContainer.style.display = 'block';
  } else {
    imgPreview.src = ''; imgPreviewContainer.style.display = 'none';
  }
  overlay.classList.add('show');
  setTimeout(() => mTitle.focus(), 30);
}

function closeModal() { overlay.classList.remove('show'); editingId = null; mImage.value = ''; }

document.getElementById('fabAdd').onclick = () => openModal('添加日志');
document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

mImage.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('uploadLabel').textContent = '⏳ 正在压缩图片...';
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1200, maxH = 1200;
      let width = img.width, height = img.height;
      if (width > maxW || height > maxH) {
        const ratio = Math.min(maxW / width, maxH / height);
        width = Math.round(width * ratio); height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
      imgPreview.src = currentImageBase64; imgPreviewContainer.style.display = 'block';
      document.getElementById('uploadLabel').textContent = '📷 点击选择本地图片';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  mImage.value = '';
};

document.getElementById('removeImgBtn').onclick = () => {
  currentImageBase64 = ''; imgPreview.src = ''; imgPreviewContainer.style.display = 'none'; mImage.value = '';
};

document.getElementById('mSave').onclick = () => {
  const title = mTitle.value.trim();
  if (!title) { alert('请输入标题'); return; }
  if (!mDate.value) { alert('请选择日期'); return; }

  const pending = tagInput.value.trim();
  if (pending && !editingTags.includes(pending)) editingTags.push(pending);

  const logData = {
    date: mDate.value,
    time: mTime.value || '00:00',
    title: title,
    desc: mDesc.value.trim(),
    image: currentImageBase64,
    tags: [...editingTags]
  };

  if (editingId) {
    const log = state.logs.find(l => l.id === editingId);
    if (log) Object.assign(log, logData);
  } else {
    state.logs.push({ id: uid(), ...logData });
  }
  closeModal(); render();
};

document.getElementById('mDelete').onclick = () => {
  if (!editingId) { closeModal(); return; }
  if (!confirm('确定删除这条日志吗？')) return;
  state.logs = state.logs.filter(l => l.id !== editingId);
  closeModal(); render();
};

document.getElementById('logList').addEventListener('click', (e) => {
  const item = e.target.closest('.log-item');
  if (!item) return;
  const log = state.logs.find(l => l.id === item.dataset.id);
  if (log) openModal('编辑日志', log);
});

/* =========================================================
   设置弹窗
   ========================================================= */
const settingsOverlay = document.getElementById('settingsOverlay');
document.getElementById('settingsBtn').onclick = () => settingsOverlay.classList.add('show');
document.getElementById('settingsCloseBtn').onclick = () => settingsOverlay.classList.remove('show');
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('show'); });

document.getElementById('exportBtn').onclick = () => {
  let csv = '\uFEFF日期,时间,标题,描述,标签\n';
  const sorted = [...state.logs].sort((a, b) => b.date.localeCompare(a.date));
  sorted.forEach(log => {
    const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
    csv += [
      `"${log.date}"`,
      `"${log.time || ''}"`,
      `"${clean(log.title)}"`,
      `"${clean(log.desc)}"`,
      `"${clean((log.tags || []).join(' '))}"`
    ].join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `时间线日志_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
};

document.getElementById('backupBtn').onclick = () => {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `时间线日志备份_${new Date().toISOString().slice(0,10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
};

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();
importFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const importedData = JSON.parse(ev.target.result);
      if (importedData && Array.isArray(importedData.logs)) {
        if (confirm('导入会覆盖当前所有日志，确定吗？')) {
          state = importedData;
          state.logs.forEach(l => { if (!l.tags) l.tags = []; });
          saveState(); render();
          alert('✅ 数据导入成功！');
        }
      } else alert('❌ 文件格式错误');
    } catch (err) { alert('❌ 读取失败'); }
  };
  reader.readAsText(file);
  importFileInput.value = '';
};

document.getElementById('resetBtn').onclick = () => {
  const answer = prompt(
    '⚠️ 重置会清空所有日志数据，且不可恢复。\n\n' +
    '如果确定要重置，请手动输入以下文字：\n' +
    '我知道重置会把所有内容清空'
  );
  if (answer !== '我知道重置会把所有内容清空') {
    if (answer !== null) alert('❌ 输入不正确，重置已取消。');
    return;
  }
  state = defaultData();
  currentFilterTag = null;
  saveState();
  render();
  settingsOverlay.classList.remove('show');
  alert('✅ 已重置为示例数据。');
};

/* =========================================================
   GitHub 同步 UI
   ========================================================= */
const syncOverlay = document.getElementById('syncOverlay');
const ghTokenInput = document.getElementById('ghTokenInput');
const ghGistInput = document.getElementById('ghGistInput');
const autoSyncCheck = document.getElementById('autoSyncCheck');

document.getElementById('syncBtn').onclick = () => {
  ghTokenInput.value = ghToken;
  ghGistInput.value = ghGistId;
  autoSyncCheck.checked = autoSyncEnabled;
  if (!ghToken || !ghGistId) {
    setSyncStatus('ℹ️ 首次使用，请按下面的说明配置：\n1. 生成 GitHub Token（只需 gist 权限）\n2. 创建一个 Gist，文件名 journal.json，内容 {}\n3. 把 Token 和 Gist ID 填进来，点「保存配置」\n4. 点「推送」上传当前数据', 'info');
  } else if (_lastSyncTime) {
    setSyncStatus('✅ 上次同步：' + _lastSyncTime.toLocaleString(), 'ok');
  } else {
    setSyncStatus('ℹ️ 已配置。可点「测试连接」验证，或直接「推送」。', 'info');
  }
  syncOverlay.classList.add('show');
};

document.getElementById('syncCloseBtn').onclick = () => syncOverlay.classList.remove('show');
syncOverlay.addEventListener('click', e => { if (e.target === syncOverlay) syncOverlay.classList.remove('show'); });

document.getElementById('syncSaveConfigBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  setSyncStatus('✅ 配置已保存到本机。可点「测试连接」验证。', 'ok');
};

document.getElementById('testConnBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  testConnection();
};

autoSyncCheck.onchange = () => {
  autoSyncEnabled = autoSyncCheck.checked;
  localStorage.setItem(AUTO_SYNC_KEY, autoSyncEnabled ? '1' : '0');
  if (autoSyncEnabled && ghToken && ghGistId) {
    pushToCloud({ silent: true });
  }
};

document.getElementById('syncPushBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  pushToCloud();
};

document.getElementById('syncPullBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  if (!confirm('拉取会用云端数据覆盖本地，确定吗？')) return;
  pullFromCloud();
};

/* =========================================================
   初始化
   ========================================================= */
render();
</script>
